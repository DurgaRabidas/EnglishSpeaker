<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart AI Speaking Coach</title>
    <style>
        :root { --primary: #4f46e5; --bg: #f3f4f6; --card: #ffffff; --text: #1f2937; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 500px; width: 100%; background: var(--card); padding: 20px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); box-sizing: border-box; }
        h1 { font-size: 1.4rem; text-align: center; color: var(--primary); margin: 0 0 5px 0; }
        .subtitle { text-align: center; font-size: 0.85rem; color: #6b7280; margin-bottom: 15px; }
        .lang-toggle { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .toggle-btn { padding: 10px 16px; font-size: 0.9rem; border: 2px solid #d1d5db; border-radius: 20px; background: #fff; cursor: pointer; font-weight: bold; }
        .toggle-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .status { text-align: center; font-size: 0.9rem; color: #4b5563; margin-bottom: 20px; font-weight: bold; padding: 12px; border-radius: 8px; background: #e5e7eb; min-height: 20px; }
        .chat-box { height: 260px; border: 1px solid #e5e7eb; border-radius: 12px; padding: 15px; overflow-y: auto; background: #f9fafb; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; font-size: 0.95rem; line-height: 1.4; box-sizing: border-box; word-wrap: break-word; }
        .input-msg { background: #e0e7ff; color: #1e3a8a; align-self: flex-start; }
        .reply-msg { background: var(--primary); color: #fff; align-self: flex-end; font-weight: bold; }
        
        /* Layout Controls Layout */
        .controls { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%; }
        .mic-btn { background: var(--primary); border: none; width: 70px; height: 70px; border-radius: 50%; color: white; font-size: 2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3); }
        .mic-btn.listening { background: #ef4444; }
        
        .type-box { display: flex; width: 100%; gap: 8px; }
        .type-input { flex: 1; padding: 12px; border: 2px solid #d1d5db; border-radius: 8px; font-size: 0.95rem; }
        .send-btn { background: #059669; color: white; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        .debug-panel { width: 100%; max-width: 500px; background: #1e293b; color: #38bdf8; font-family: monospace; font-size: 0.75rem; padding: 10px; border-radius: 8px; margin-top: 15px; box-sizing: border-box; max-height: 80px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="container">
    <h1>🗣️ Smart AI Speaking Coach</h1>
    <div class="subtitle">Trilingual Dynamic Learning App</div>
    
    <div class="lang-toggle">
        <button class="toggle-btn active" id="btnBn">🇧🇩 Bengali</button>
        <button class="toggle-btn" id="btnHi">🇮🇳 Hindi</button>
    </div>

    <div class="status" id="statusText">System Ready.</div>
    <div class="chat-box" id="chatBox"></div>
    
    <div class="controls">
        <button class="mic-btn" id="micBtn">🎙️</button>
        
        <!-- Text box bypass option if browser locks mic engine permissions -->
        <div class="type-box">
            <input type="text" class="type-input" id="textInput" placeholder="Type sentence here if mic fails...">
            <button class="send-btn" id="sendBtn">Send</button>
        </div>
    </div>
</div>

<div class="debug-panel" id="debugLog">⚙️ System Console Init.</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('statusText');
    const btnBn = document.getElementById('btnBn');
    const btnHi = document.getElementById('btnHi');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');
    const logBox = document.getElementById('debugLog');
    
    let currentNativeMode = 'bn-IN';
    let isListening = false;
    let recognition = null;

    function debugLog(msg) {
        logBox.innerHTML += `<br>> ${msg}`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    // High speed backup dictionary array
    const localDictionary = [
        { keywords: ["নমস্কার", "হ্যালো", "नमस्ते"], reply: "Hello!", lang: "en" },
        { keywords: ["কেমন আছো", "कैसे हो"], reply: "How are you?", lang: "en" },
        { keywords: ["ভালো আছি", "ठीक हूँ"], reply: "I am fine.", lang: "en" },
        { keywords: ["তোমার নাম কি", "आपका नाम क्या है"], reply: "What is your name?", lang: "en" },
        { keywords: ["धोন্যবাদ", "धन्यवाद"], reply: "Thank you!", lang: "en" }
    ];

    function setupSpeechEngine() {
        try {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                debugLog("Voice capture unsupported by browser layout. Text mode unlocked.");
                statusText.innerText = "💬 Text Mode Active (Mic Disabled)";
                micBtn.style.opacity = "0.4";
                return;
            }
            
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = currentNativeMode;

            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('listening');
                statusText.innerText = "🛑 Listening closely...";
            };

            recognition.onerror = (e) => {
                isListening = false;
                micBtn.classList.remove('listening');
                statusText.innerText = "❌ Mic Error. Try typing below!";
                debugLog(`Mic error code: ${e.error}`);
            };

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript.trim();
                handleIncomingInput(text);
            };

            recognition.onend = () => {
                isListening = false;
                micBtn.classList.remove('listening');
                if(!statusText.innerText.includes("Fetching")) {
                    statusText.innerText = "✅ Ready.";
                }
            };
            
            statusText.innerText = "✅ Ready. Tap Mic or Type.";
        } catch(e) {
            debugLog("Engine configuration error skipped safely.");
        }
    }

    function changeMode(langCode) {
        currentNativeMode = langCode;
        btnBn.classList.toggle('active', langCode === 'bn-IN');
        btnHi.classList.toggle('active', langCode === 'hi-IN');
        statusText.innerText = langCode === 'bn-IN' ? "Mode: Bengali Active" : "Mode: Hindi Active";
        debugLog(`Switched target lang: ${langCode}`);
        if(recognition) {
            try { recognition.stop(); } catch(err){}
            recognition.lang = currentNativeMode;
        }
    }

    function handleMicClick() {
        if (!window.SpeechRecognition && !window.webkitSpeechRecognition) {
            alert("Your browser is blocking microphone links. Please type your phrase inside the entry field instead!");
            return;
        }
        if (!recognition) setupSpeechEngine();
        
        if (isListening) {
            recognition.stop();
        } else {
            try { recognition.start(); } catch(e) { setupSpeechEngine(); }
        }
    }

    function handleTextSend() {
        const text = textInput.value.trim();
        if(!text) return;
        textInput.value = "";
        handleIncomingInput(text);
    }

    function handleIncomingInput(text) {
        addMessage("🗣️ You: " + text, 'input-msg');
        processHybridLogic(text);
    }

    async function processHybridLogic(text) {
        const lower = text.toLowerCase();
        let answer = null;
        let targetLang = 'en';

        // Step 1: Local lookup search
        for (let entry of localDictionary) {
            if(entry.keywords.some(k => lower.includes(k))) {
                answer = (typeof entry.reply === 'object') ? entry.reply[currentNativeMode === 'bn-IN' ? 'bn' : 'hi'] : entry.reply;
                break;
            }
        }

        // Step 2: Global API fallback loop
        if (!answer) {
            statusText.innerText = "⏳ Fetching translation...";
            const hasEnglish = /[a-zA-Z]/.test(text);
            const hasBengali = /[\u0980-\u09FF]/.test(text);
            let sl = hasBengali ? 'bn' : (/[\u0900-\u097F]/.test(text) ? 'hi' : 'en');
            targetLang = (sl === 'en') ? (currentNativeMode === 'bn-IN' ? 'bn' : 'hi') : 'en';

            try {
                const url = `https://translated.net{encodeURIComponent(text)}&langpair=${sl}|${targetLang}`;
                const response = await fetch(url);
                const data = await response.json();
                if(data && data.responseData) answer = data.responseData.translatedText;
            } catch(e) { debugLog("API endpoint load timeout."); }
        }

        if (answer) {
            let label = targetLang === 'en' ? '🇬🇧 English: ' : (targetLang === 'bn' ? '🇧🇩 Bengali: ' : '🇮🇳 Hindi: ');
            addMessage(label + answer, 'reply-msg');
            statusText.innerText = "🔊 Speaking...";
            
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
