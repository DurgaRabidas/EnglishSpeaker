<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BhashaSpeak - Pure Offline Voice Translator</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-light: #64748b;
      --listening: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    
    .translator-card { background: var(--card); padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); width: 100%; max-width: 480px; text-align: center; }
    h1 { font-size: 1.8rem; margin-bottom: 8px; color: var(--primary); }
    .subtitle { color: var(--text-light); font-size: 0.95rem; margin-bottom: 24px; }
    
    .mode-container { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 30px; background: #f1f5f9; padding: 8px 16px; border-radius: 30px; }
    select { border: none; background: transparent; font-size: 1rem; font-weight: 600; color: var(--text); cursor: pointer; outline: none; }

    .mic-btn { width: 90px; height: 90px; border-radius: 50%; border: none; background: var(--primary); color: white; font-size: 2rem; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 8px 16px rgba(79, 70, 229, 0.3); display: inline-flex; align-items: center; justify-content: center; outline: none; }
    .mic-btn:hover { background: var(--primary-hover); transform: scale(1.05); }
    .mic-btn.listening { background: var(--listening); animation: pulse 1.5s infinite; box-shadow: 0 8px 16px rgba(239, 68, 68, 0.4); }
    .mic-btn:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; }
    
    .status-text { margin-top: 12px; font-size: 0.9rem; font-weight: 600; color: var(--text-light); min-height: 20px; }

    .display-box { margin-top: 30px; text-align: left; background: #f8fafc; border-radius: 12px; padding: 16px; border: 1px solid #e2e8f0; }
    .log-group { margin-bottom: 16px; }
    .log-group:last-child { margin-bottom: 0; }
    .label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-light); margin-bottom: 4px; }
    .text-content { font-size: 1.05rem; font-weight: 500; min-height: 24px; }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="translator-card">
    <h1>BhashaSpeak</h1>
    <p class="subtitle">100% Offline Voice Translator</p>
    
    <div class="mode-container">
      <select id="direction">
        <option value="hi-to-en">Hindi ➔ English</option>
        <option value="en-to-hi">English ➔ Hindi</option>
      </select>
    </div>

    <button id="micBtn" class="mic-btn" disabled>⏳</button>
    <div id="statusText" class="status-text">Loading translation engine AI (First time setup)...</div>

    <div class="display-box">
      <div class="log-group">
        <div class="label" id="inputLabel">You Spoke (Hindi)</div>
        <div class="text-content" id="inputText">...</div>
      </div>
      <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 12px 0;">
      <div class="log-group">
        <div class="label" id="outputLabel">Translation (English)</div>
        <div class="text-content" id="outputText" style="color: var(--primary);">...</div>
      </div>
    </div>
  </div>

  <!-- Import Transformers.js for on-device browser translation -->
  <script type="module">
    import { pipeline } from 'https://jsdelivr.net';

    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('statusText');
    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const directionSelect = document.getElementById('direction');
    const inputLabel = document.getElementById('inputLabel');
    const outputLabel = document.getElementById('outputLabel');

    let isListening = false;
    let recognition;
    let translator = null;

    // Initialize the offline AI model (Xenova/XLM-RoBERTa based translation or Xenova/nllb-200-distilled-600M)
    // We use a small optimized translation model for browsers
    async function initAI() {
      try {
        statusText.textContent = "Downloading AI Model (~40MB)... Please wait.";
        // Initialize Xenova's translation pipeline targeting Hindi/English tasks
        translator = await pipeline('translation', 'Xenova/m2m100_418M'); 
        
        statusText.textContent = "Ready! Tap the mic to talk.";
        micBtn.innerHTML = "🎤";
        micBtn.disabled = false;
      } catch (e) {
        console.error(e);
        statusText.textContent = "AI engine failed to load. Check internet for first setup.";
      }
    }

    // Start setup
    initAI();

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      statusText.textContent = "Error: Browser speech recognition not supported.";
      micBtn.style.display = "none";
    } else {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;

      directionSelect.addEventListener('change', () => {
        if(directionSelect.value === 'hi-to-en') {
          inputLabel.textContent = "You Spoke (Hindi)";
          outputLabel.textContent = "Translation (English)";
        } else {
          inputLabel.textContent = "You Spoke (English)";
          outputLabel.textContent = "Translation (Hindi)";
        }
        resetDisplay();
      });

      micBtn.addEventListener('click', () => {
        if (!isListening) {
          const mode = directionSelect.value;
          recognition.lang = mode === 'hi-to-en' ? 'hi-IN' : 'en-US';
          try {
            recognition.start();
          } catch(e) {}
        } else {
          recognition.stop();
        }
      });

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('listening');
        statusText.textContent = "Listening... Speak now";
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove('listening');
      };

      recognition.onerror = (event) => {
        isListening = false;
        micBtn.classList.remove('listening');
        statusText.textContent = `Speech error: ${event.error}`;
      };

      recognition.onresult = async (event) => {
        const spokenText = event.results.transcript;
        inputText.textContent = spokenText;
        
        statusText.textContent = "AI is translating locally...";
        const mode = directionSelect.value;
        
        // Define exact language keys for the M2M100 Model
        const srcLang = mode === 'hi-to-en' ? 'hi' : 'en';
        const tgtLang = mode === 'hi-to-en' ? 'en' : 'hi';

        if (translator) {
          const output = await translator(spokenText, {
            src_lang: srcLang,
            tgt_lang: tgtLang,
          });
          
          const translatedText = output[0].translation_text;
          outputText.textContent = translatedText;

          statusText.textContent = "Speaking translation...";
          speakText(translatedText, tgtLang);
        }
      };
    }

    function resetDisplay() {
      inputText.textContent = "...";
      outputText.textContent = "...";
      statusText.textContent = "Tap the mic to talk";
    }

    function speakText(text, langCode) {
      window.speechSynthesis.cancel(); 
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = langCode === 'hi' ? 'hi-IN' : 'en-US';
      
      utterance.onend = () => {
        statusText.textContent = "Tap the mic to talk";
      };
      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
