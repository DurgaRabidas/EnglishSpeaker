<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trilingual AI Coach</title>
    <style>
        :root { --primary: #4f46e5; --bg: #f3f4f6; --card: #ffffff; --text: #1f2937; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 500px; width: 100%; background: var(--card); padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); box-sizing: border-box; }
        h1 { font-size: 1.4rem; text-align: center; color: var(--primary); margin-top: 0; margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 0.85rem; color: #6b7280; margin-bottom: 15px; }
        .lang-toggle { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .toggle-btn { padding: 6px 12px; font-size: 0.85rem; border: 1px solid #d1d5db; border-radius: 20px; background: #fff; cursor: pointer; font-weight: bold; }
        .toggle-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .status { text-align: center; font-size: 0.9rem; color: #4b5563; margin-bottom: 20px; font-weight: bold; min-height: 20px; padding: 8px; border-radius: 8px; background: #e5e7eb; }
        .chat-box { height: 320px; border: 1px solid #e5e7eb; border-radius: 12px; padding: 15px; overflow-y: auto; background: #f9fafb; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; font-size: 0.95rem; line-height: 1.4; box-sizing: border-box; }
        .input-msg { background: #e0e7ff; color: #1e3a8a; align-self: flex-start; }
        .reply-msg { background: var(--primary); color: #fff; align-self: flex-end; font-weight: bold; }
        .controls { display: flex; justify-content: center; }
        .mic-btn { background: var(--primary); border: none; width: 75px; height: 75px; border-radius: 50%; color: white; font-size: 2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.4); }
        .mic-btn.listening { background: #ef4444; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="container">
    <h1>🗣️ Trilingual Speaking Coach</h1>
    <div class="subtitle">Supports English, Hindi & Bengali</div>
    
    <div class="lang-toggle">
        <button class="toggle-btn active" id="btnBn" onclick="setNativeLang('bn-IN')">🇧🇩 Bengali Mode</button>
        <button class="toggle-btn" id="btnHi" onclick="setNativeLang('hi-IN')">🇮🇳 Hindi Mode</button>
    </div>

    <div class="status" id="statusText">System Ready. Tap Mic.</div>
    <div class="chat-box" id="chatBox"></div>
    <div class="controls">
        <button class="mic-btn" id="micBtn" onclick="toggleListening()">🎙️</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('statusText');
    
    let currentNativeMode = 'bn-IN';
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isListening = false;

    function initRecognition() {
        if (!SpeechRecognition) {
            statusText.innerText = "❌ Browser unsupported. Use real Chrome/Safari.";
            return;
        }
        
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = currentNativeMode; 

        recognition.onstart = () => {
            isListening = true;
            micBtn.classList.add('listening');
            statusText.innerText = "🛑 Listening closely... Speak now!";
            statusText.style.color = "#ef4444";
        };

        recognition.onerror = (e) => {
            console.error(e);
            statusText.innerText = "❌ Error: " + e.error + ". Check Mic Permissions!";
            statusText.style.color = "#ef4444";
            isListening = false;
            micBtn.classList.remove('listening');
        };

        recognition.onresult = (event) => {
            const spokenText = event.results[0][0].transcript.trim();
            if (spokenText) {
                addMessage("🗣️ You: " + spokenText, 'input-msg');
                processTrilingualLogic(spokenText);
            } else {
                statusText.innerText = "⚠️ Capturing failed. Try again.";
            }
        };

        recognition.onend = () => {
            isListening = false;
            micBtn.classList.remove('listening');
            if (statusText.innerText.includes("Listening")) {
                statusText.innerText = "Processing audio match...";
                statusText.style.color = "#2563eb";
            }
        };
    }

    function setNativeLang(langCode) {
        currentNativeMode = langCode;
        document.getElementById('btnBn').classList.toggle('active', langCode === 'bn-IN');
        document.getElementById('btnHi').classList.toggle('active', langCode === 'hi-IN');
        statusText.innerText = "Switched modes. Tap mic to speak.";
        statusText.style.color = "#4b5563";
        if (isListening) recognition.stop();
    }

    async function processTrilingualLogic(text) {
        statusText.innerText = "🧠 Compiling translation stream...";
        statusText.style.color = "#2563eb";

        const hasEnglishAlphabet = /[a-zA-Z]/.test(text);
        const hasBengali = /[\u0980-\u09FF]/.test(text);
        const hasHindi = /[\u0900-\u097F]/.test(text);

        let sourceLang = 'auto';
        let targetLang = 'en'; 

        if ((hasBengali || hasHindi) && !hasEnglishAlphabet) {
            sourceLang = hasBengali ? 'bn' : 'hi';
            targetLang = 'en';
        } else if (!hasBengali && !hasHindi && hasEnglishAlphabet) {
            sourceLang = 'en';
            targetLang = currentNativeMode === 'bn-IN' ? 'bn' : 'hi';
        } else {
            sourceLang = 'auto';
            targetLang = 'en';
        }

        try {
            const url = `https://googleapis.com{sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
            const response = await fetch(url);
            const data = await response.json();
            
            let translatedResult = "";
            if (data && data[0]) {
                data[0].forEach(element => {
                    if (element[0]) translatedResult += element[0];
                });
            }

            if (!translatedResult) {
                statusText.innerText = "⚠️ Engine match timeout.";
                return;
            }

            let flag = '🇬🇧 English: ';
            if (targetLang === 'bn') flag = '🇧🇩 Bengali: ';
            if (targetLang === 'hi') flag = '🇮🇳 Hindi: ';
            
            addMessage(flag + translatedResult, 'reply-msg');
            statusText.innerText = "🔊 Speaking translation...";
            statusText.style.color = "#059669";
            
            speakTextLocally(translatedResult, targetLang);
        } catch (error) {
            statusText.innerText = "❌ Network processing failure.";
        }
    }

    function speakTextLocally(text, targetLang) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(text);
            
            if (targetLang === 'bn') utterance.lang = 'bn-IN';
            else if (targetLang === 'hi') utterance.lang = 'hi-IN';
            else {
                utterance.lang = 'en-US';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
            }

            window.speechSynthesis.speak(utterance);
            utterance.onend = () => {
                statusText.innerText = "✅ Done! Tap mic to speak again.";
                statusText.style.color = "#059669";
            };
        }
    }

    function addMessage(text, className) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${className}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function toggleListening() {
        if (!recognition) initRecognition();
        if (!recognition) return;
        
        if (isListening) {
            recognition.stop();
        } else {
            try { 
                recognition.start(); 
            } catch(e) { 
                recognition.stop(); 
            }
        }
    }

    window.onload = () => {
        initRecognition();
        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
        }
    };
</script>

</body>
</html>
