<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instant Smart Speaking Coach</title>
    <style>
        :root { --primary: #4f46e5; --bg: #f3f4f6; --card: #ffffff; --text: #1f2937; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 500px; width: 100%; background: var(--card); padding: 20px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); box-sizing: border-box; }
        h1 { font-size: 1.4rem; text-align: center; color: var(--primary); margin: 0 0 5px 0; }
        .subtitle { text-align: center; font-size: 0.85rem; color: #6b7280; margin-bottom: 15px; }
        .lang-toggle { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .toggle-btn { padding: 10px 16px; font-size: 0.9rem; border: 2px solid #d1d5db; border-radius: 20px; background: #fff; cursor: pointer; font-weight: bold; -webkit-tap-highlight-color: transparent; }
        .toggle-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .status { text-align: center; font-size: 0.9rem; color: #4b5563; margin-bottom: 20px; font-weight: bold; padding: 12px; border-radius: 8px; background: #e5e7eb; min-height: 20px; }
        .chat-box { height: 280px; border: 1px solid #e5e7eb; border-radius: 12px; padding: 15px; overflow-y: auto; background: #f9fafb; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; font-size: 0.95rem; line-height: 1.4; box-sizing: border-box; word-wrap: break-word; }
        .input-msg { background: #e0e7ff; color: #1e3a8a; align-self: flex-start; }
        .reply-msg { background: var(--primary); color: #fff; align-self: flex-end; font-weight: bold; }
        .controls { display: flex; justify-content: center; }
        .mic-btn { background: var(--primary); border: none; width: 75px; height: 75px; border-radius: 50%; color: white; font-size: 2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3); -webkit-tap-highlight-color: transparent; }
        .mic-btn.listening { background: #ef4444; }
        .debug-panel { width: 100%; max-width: 500px; background: #1e293b; color: #38bdf8; font-family: monospace; font-size: 0.75rem; padding: 10px; border-radius: 8px; margin-top: 15px; box-sizing: border-box; max-height: 100px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="container">
    <h1>🗣️ Smart AI Speaking Coach</h1>
    <div class="subtitle">Instant Local Processing + Network Core</div>
    
    <div class="lang-toggle">
        <button class="toggle-btn active" id="btnBn">🇧🇩 Bengali</button>
        <button class="toggle-btn" id="btnHi">🇮🇳 Hindi</button>
    </div>

    <div class="status" id="statusText">Initializing Voice Engine...</div>
    <div class="chat-box" id="chatBox"></div>
    <div class="controls">
        <button class="mic-btn" id="micBtn">🎙️</button>
    </div>
</div>

<div class="debug-panel" id="debugLog">⚙️ System Console Ready.</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('statusText');
    const btnBn = document.getElementById('btnBn');
    const btnHi = document.getElementById('btnHi');
    const logBox = document.getElementById('debugLog');
    
    let currentNativeMode = 'bn-IN';
    let isListening = false;
    let recognition = null;

    function debugLog(msg, isError = false) {
        const time = new Date().toLocaleTimeString();
        logBox.innerHTML += `<br><span style="color:${isError ? '#f87171' : '#38bdf8'}">[${time}] ${msg}</span>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    // Capture crashes instantly
    window.onerror = function(message, source, lineno, colno, error) {
        debugLog(`CRASH: ${message} (Line ${lineno})`, true);
        return false;
    };

    // Fast-loading local database dictionary strings
    const localDictionary = [
        { keywords: ["নমস্কার", "হ্যালো"], reply: "Hello!", lang: "en" },
        { keywords: ["কেমন আছো", "কেমন আছেন"], reply: "How are you?", lang: "en" },
        { keywords: ["ভালো আছি", "ভাল আছি"], reply: "I am fine.", lang: "en" },
        { keywords: ["তোমার নাম কি", "আপনার নাম কি"], reply: "What is your name?", lang: "en" },
        { keywords: ["ধন্যবাদ"], reply: "Thank you!", lang: "en" },
        { keywords: ["नमस्ते", "हेलो"], reply: "Hello!", lang: "en" },
        { keywords: ["कैसे हो", "क्या हाल है"], reply: "How are you?", lang: "en" },
        { keywords: ["ठीक हूँ", "बढ़िया हूँ"], reply: "I am fine.", lang: "en" },
        { keywords: ["आपका नाम क्या है"], reply: "What is your name?", lang: "en" },
        { keywords: ["धन्यवाद", "शुक्रिया"], reply: "Thank you!", lang: "en" },
        { keywords: ["hello", "hi"], reply: { hi: "नमस्ते!", bn: "নমস্কার!" } },
        { keywords: ["how are you"], reply: { hi: "आप कैसे हैं?", bn: "তুমি কেমন আছো?" } }
    ];

    function setupSpeechEngine() {
        try {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                statusText.innerText = "❌ Browser unsupported.";
                debugLog("SpeechRecognition missing. Use Google Chrome or Safari App.", true);
                return false;
            }
            
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = currentNativeMode;

            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('listening');
                statusText.innerText = "🛑 Listening... Speak now!";
                statusText.style.color = "#ef4444";
                debugLog(`Mic active channel: ${recognition.lang}`);
            };

            recognition.onerror = (e) => {
                isListening = false;
                micBtn.classList.remove('listening');
                statusText.innerText = "❌ Mic Error.";
                debugLog(`Mic pipeline issue: ${e.error}`, true);
            };

            recognition.onresult = (event) => {
                if (event.results && event.results[0] && event.results[0][0]) {
                    const text = event.results[0][0].transcript.trim();
                    debugLog(`Heard voice input: "${text}"`);
                    addMessage("🗣️ You: " + text, 'input-msg');
                    processHybridLogic(text);
                }
            };

            recognition.onend = () => {
                isListening = false;
                micBtn.classList.remove('listening');
                if (!statusText.innerText.includes("Speaking") && !statusText.innerText.includes("Fetching")) {
                    statusText.innerText = "✅ Ready. Tap Mic.";
                    statusText.style.color = "#4b5563";
                }
            };

            statusText.innerText = "✅ Ready. Tap Mic.";
            return true;
        } catch(err) {
            debugLog(`Engine failure: ${err.message}`, true);
            return false;
        }
    }

    function changeMode(langCode) {
        debugLog(`Switching language mode: ${langCode}`);
        currentNativeMode = langCode;
        btnBn.classList.toggle('active', langCode === 'bn-IN');
        btnHi.classList.toggle('active', langCode === 'hi-IN');
        statusText.innerText = langCode === 'bn-IN' ? "Mode: Bengali Active" : "Mode: Hindi Active";
        
        if (isListening && recognition) {
            recognition.stop();
        }
        setupSpeechEngine();
    }

    function handleMicClick() {
        if (!recognition) setupSpeechEngine();
        if (!recognition) return;

        if (isListening) {
            recognition.stop();
        } else {
            try { 
                recognition.start(); 
            } catch (e) { 
                debugLog(`Resetting active audio loops...`);
                recognition.stop();
            }
        }
    }

    async function processHybridLogic(text) {
        const lower = text.toLowerCase();
        let answer = null;
        let targetLang = 'en';

        // Stage 1: Fast local match
        for (let entry of localDictionary) {
            let matched = entry.keywords.some(k => lower.includes(k));
            if (matched) {
                if (typeof entry.reply === 'object') {
                    targetLang = currentNativeMode === 'bn-IN' ? 'bn' : 'hi';
                    answer = entry.reply[targetLang];
                } else {
                    answer = entry.reply;
                    targetLang = entry.lang;
                }
                debugLog("🎯 Fast local match verified.");
                break;
            }
        }

        // Stage 2: Safe open API bypass network
        if (!answer) {
            debugLog("Routing query through MyMemory API network...");
            statusText.innerText = "⏳ Fetching translation...";
            
            const hasEnglish = /[a-zA-Z]/.test(text);
            const hasBengali = /[\u0980-\u09FF]/.test(text);

            let sl = 'hi';
            if (hasBengali) sl = 'bn';
            else if (hasEnglish) sl = 'en';

            targetLang = (sl === 'en') ? (currentNativeMode === 'bn-IN' ? 'bn' : 'hi') : 'en';

            try {
                // Tapping MyMemory translation core which allows global CORS fetch requests safely
