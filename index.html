<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Trilingual AI Coach</title>
    <style>
        :root { --primary: #4f46e5; --bg: #f3f4f6; --card: #ffffff; --text: #1f2937; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 500px; width: 100%; background: var(--card); padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); box-sizing: border-box; }
        h1 { font-size: 1.4rem; text-align: center; color: var(--primary); margin-top: 0; margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 0.85rem; color: #6b7280; margin-bottom: 15px; }
        .lang-toggle { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .toggle-btn { padding: 6px 12px; font-size: 0.85rem; border: 1px solid #d1d5db; border-radius: 20px; background: #fff; cursor: pointer; font-weight: bold; }
        .toggle-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .status { text-align: center; font-size: 0.9rem; color: #4b5563; margin-bottom: 20px; font-weight: bold; min-height: 20px; padding: 8px; border-radius: 8px; background: #e5e7eb; }
        .chat-box { height: 320px; border: 1px solid #e5e7eb; border-radius: 12px; padding: 15px; overflow-y: auto; background: #f9fafb; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; font-size: 0.95rem; line-height: 1.4; box-sizing: border-box; }
        .input-msg { background: #e0e7ff; color: #1e3a8a; align-self: flex-start; }
        .reply-msg { background: var(--primary); color: #fff; align-self: flex-end; font-weight: bold; }
        .controls { display: flex; justify-content: center; }
        .mic-btn { background: var(--primary); border: none; width: 75px; height: 75px; border-radius: 50%; color: white; font-size: 2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.4); }
        .mic-btn.listening { background: #ef4444; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ Fast Trilingual Coach</h1>
    <div class="subtitle">Instant Processing Mode</div>
    
    <div class="lang-toggle">
        <button class="toggle-btn active" id="btnBn" onclick="setNativeLang('bn-IN')">🇧🇩 Bengali Mode</button>
        <button class="toggle-btn" id="btnHi" onclick="setNativeLang('hi-IN')">🇮🇳 Hindi Mode</button>
    </div>

    <div class="status" id="statusText">Ready. Tap Mic.</div>
    <div class="chat-box" id="chatBox"></div>
    <div class="controls">
        <button class="mic-btn" id="micBtn" onclick="toggleListening()">🎙️</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('statusText');
    
    let currentNativeMode = 'bn-IN';
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isListening = false;

    // FAST LOCAL LOOKUP DICTIONARY (Bypasses internet lag entirely for common phrases)
    const quickDict = {
        "hi": "नमस्ते", "hello": "नमस्ते", "how are you": "आप कैसे हैं?", "i am fine": "मैं ठीक हूँ", "thank you": "धन्यवाद",
        "तुम्हारा नाम क्या है": "What is your name?", "आप कैसे हैं": "How are you?", "मैं ठीक हूँ": "I am fine", "धन्यवाद": "Thank you",
        "তোমার নাম কি": "What is your name?", "তুমি কেমন আছো": "How are you?", "আমি ভালো আছি": "I am fine", "ধন্যবাদ": "Thank you"
    };

    function initRecognition() {
        if (!SpeechRecognition) return;
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        // Optimization: Get results instantly instead of waiting for long silence gaps
        recognition.interimResults = false; 
        recognition.lang = currentNativeMode; 

        recognition.onstart = () => {
            isListening = true;
            micBtn.classList.add('listening');
            statusText.innerText = "🛑 Listening...";
        };

        recognition.onerror = () => {
            isListening = false;
            micBtn.classList.remove('listening');
            statusText.innerText = "⚠️ Mic error. Try again.";
        };

        recognition.onresult = (event) => {
            const spokenText = event.results[0][0].transcript.trim();
            addMessage("🗣️ You: " + spokenText, 'input-msg');
            
            // Speed Trick: Check if it's a common word before asking the server
            const cleanText = spokenText.toLowerCase().replace(/[.,\/#!\$%\^&\*;:{}=\-_`~()?।]/g,"");
            if (quickDict[cleanText]) {
                showAndSpeak(quickDict[cleanText], /[a-zA-Z]/.test(quickDict[cleanText]) ? 'en' : (currentNativeMode === 'bn-IN' ? 'bn' : 'hi'));
            } else {
                processTrilingualLogic(spokenText);
            }
        };

        recognition.onend = () => {
            isListening = false;
            micBtn.classList.remove('listening');
        };
    }

    function setNativeLang(langCode) {
        currentNativeMode = langCode;
        document.getElementById('btnBn').classList.toggle('active', langCode === 'bn-IN');
        document.getElementById('btnHi').classList.toggle('active', langCode === 'hi-IN');
        statusText.innerText = "Mode changed.";
        if (isListening) recognition.stop();
    }

    async function processTrilingualLogic(text) {
        statusText.innerText = "⚡ Processing instantly...";
        
        const hasEnglish = /[a-zA-Z]/.test(text);
        const hasBengali = /[\u0980-\u09FF]/.test(text);
        const hasHindi = /[\u0900-\u097F]/.test(text);

        let sourceLang = 'auto';
        let targetLang = 'en'; 

        if ((hasBengali || hasHindi) && !hasEnglish) {
            sourceLang = hasBengali ? 'bn' : 'hi';
            targetLang = 'en';
        } else if (!hasBengali && !hasHindi && hasEnglish) {
            sourceLang = 'en';
            targetLang = currentNativeMode === 'bn-IN' ? 'bn' : 'hi';
        }

        try {
            // Speed optimization: Optimized client query parameter for rapid API response
            const url = `https://googleapis.com{sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
            const response = await fetch(url);
            const data = await response.json();
            
            let translatedResult = data?.[0]?.[0]?.[0] || "";
            if (translatedResult) {
                showAndSpeak(translatedResult, targetLang);
            } else {
                statusText.innerText = "⏳ System timeout.";
            }
        } catch (error) {
            statusText.innerText = "❌ Network lag.";
        }
    }

    function showAndSpeak(translatedResult, targetLang) {
        let flag = '🇬🇧 English: ';
        if (targetLang === 'bn') flag = '🇧🇩 Bengali: ';
        if (targetLang === 'hi') flag = '🇮🇳 Hindi: ';
        
        addMessage(flag + translatedResult, 'reply-msg');
        statusText.innerText = "🔊 Speaking...";
        speakTextLocally(translatedResult, targetLang);
    }

    function speakTextLocally(text, targetLang) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(text);
            
            if (targetLang === 'bn') utterance.lang = 'bn-IN';
            else if (targetLang === 'hi') utterance.lang = 'hi-IN';
            else {
                utterance.lang = 'en-US';
                utterance.rate = 1.05; // Sped up slightly to sound snappy and energetic
                utterance.pitch = 1.02;
            }

            window.speechSynthesis.speak(utterance);
            utterance.onend = () => { statusText.innerText = "✅ Tap mic to speak."; };
        }
    }

    function addMessage(text, className) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${className}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function toggleListening() {
        if (!recognition) initRecognition();
        if (isListening) { recognition.stop(); } 
        else { try { recognition.start(); } catch(e) { recognition.stop(); } }
    }

    window.onload = () => {
        initRecognition();
        if ('speechSynthesis' in window) { window.speechSynthesis.getVoices(); }
    };
</script>

</body>
</html>
