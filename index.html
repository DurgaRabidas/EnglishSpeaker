<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natural Voice Coach</title>
    <!-- Add ResponsiveVoice API Library for ultra-realistic human text-to-speech -->
    <script src="https://responsivevoice.org"></script>
    <style>
        :root { --primary: #059669; --bg: #f0fdf4; --card: #ffffff; --text: #1f2937; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 500px; width: 100%; background: var(--card); padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); box-sizing: border-box; }
        h1 { font-size: 1.5rem; text-align: center; color: var(--primary); margin-top: 0; }
        .status { text-align: center; font-size: 0.9rem; color: #6b7280; margin-bottom: 20px; font-weight: bold; min-height: 20px; }
        .chat-box { height: 300px; border: 1px solid #e5e7eb; border-radius: 12px; padding: 15px; overflow-y: auto; background: #f9fafb; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; font-size: 0.95rem; line-height: 1.4; }
        .hindi { background: #fee2e2; color: #991b1b; align-self: flex-start; }
        .english { background: var(--primary); color: #fff; align-self: flex-end; font-weight: bold; }
        .system { background: #e5e7eb; color: #374151; align-self: center; font-size: 0.85rem; text-align: center; width: 90%; }
        .controls { display: flex; justify-content: center; }
        .mic-btn { background: var(--primary); border: none; width: 75px; height: 75px; border-radius: 50%; color: white; font-size: 2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4); }
        .mic-btn.listening { background: #ef4444; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="container">
    <h1>🇮🇳 ➡️ 🇬🇧 Ultra-Natural Voice Coach</h1>
    <div class="status" id="statusText">Tap the mic and start speaking Hindi...</div>
    
    <div class="chat-box" id="chatBox"></div>

    <div class="controls">
        <button class="mic-btn" id="micBtn" onclick="toggleListening()">🎙️</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('statusText');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isListening = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.lang = 'hi-IN'; 
        recognition.interimResults = false;

        recognition.onstart = () => {
            statusText.innerText = "🛑 Listening... Speak Hindi now!";
            statusText.style.color = "#ef4444";
        };

        recognition.onerror = (e) => {
            statusText.innerText = "❌ Mic error: " + e.error;
            statusText.style.color = "#ef4444";
        };

        recognition.onresult = (event) => {
            const hindiText = event.results.transcript;
            addMessage("🇮🇳 Hindi: " + hindiText, 'hindi');
            translateAndSpeak(hindiText);
        };

        recognition.onend = () => {
            isListening = false;
            micBtn.classList.remove('listening');
        };
    }

    async function translateAndSpeak(text) {
        try {
            statusText.innerText = "⏳ Fetching translation...";
            const response = await fetch(`https://translated.net{encodeURIComponent(text)}&langpair=hi|en`);
            const data = await response.json();
            const englishTranslation = data.responseData.translatedText;
            
            addMessage("🇬🇧 English: " + englishTranslation, 'english');
            statusText.innerText = "🔊 Speaking with natural accent...";
            statusText.style.color = "#059669";
            
            speakEnglish(englishTranslation);
        } catch (error) {
            addMessage("⚠️ System connection loss. Please try again.", 'system');
            statusText.innerText = "Tap mic to retry.";
        }
    }

    // CLOUD VOICE ENGINE FOR GUARANTEED NATURAL HUMAN SOUND
    function speakEnglish(text) {
        if (window.responsiveVoice) {
            // Uses a high-definition studio voice stream directly through your browser data connection
            responsiveVoice.speak(text, "US English Female", {
                rate: 1.0,
                pitch: 1.0,
                onend: () => {
                    statusText.innerText = "✅ Done! Tap mic to speak again.";
                }
            });
        } else {
            // Fallback system logic if CDN fails
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }
    }

    function addMessage(text, className) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${className}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function toggleListening() {
        if (!recognition) return;
        if (isListening) {
            recognition.stop();
        } else {
            isListening = true;
            micBtn.classList.add('listening');
            try { recognition.start(); } catch(e) { recognition.stop(); }
        }
    }
</script>

</body>
</html>
